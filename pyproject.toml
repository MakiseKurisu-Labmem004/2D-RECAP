[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-recap"
version = "0.1.0"
description = "Numerical planar manipulation and reproducible RECAP-style research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "mujoco>=3.2,<5", "gymnasium>=1.0,<2", "torch>=2.2", "PyYAML>=6", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
video = ["imageio>=2.34", "imageio-ffmpeg>=0.5"]

[tool.setuptools.packages.find]
include = ["minimal_recap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
