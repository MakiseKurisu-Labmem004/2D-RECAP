[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "minimal-recap"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "mujoco>=3.1", "gymnasium", "torch>=2.2", "matplotlib", "PyYAML", "tqdm>=4.66"]
[project.optional-dependencies]
test = ["pytest"]
[project.scripts]
recap = "recap.cli:main"
[tool.setuptools.packages.find]
include = ["recap*"]
