  arm_gravity_compensation: true
  arm_ik_backtracks: 10
  grip_kv: 8
  gripper_motion:
    max_speed: 0.06
    max_acceleration: 0.4
    response_time: 0.2
observation:
  # 34 numerical inputs; no engineered relative position/orientation features.
  features:
  - gripper
  - object
  - goal
  - pedestal
  - geometry
  - arm
  normalize: true
reward:
  gamma: 1.0
  step: -1
  success: 0
  failure_cost: auto
  version: arm3r_upright_stable_target_v1
  support: auto
model:
  device: cuda
  hidden_layers: 6
  hidden_units: 128
  activation: relu
  value_bins: 201
  soft_bins: true
expert_rollout:
  successes: 100
  max_control_steps: null
  max_attempts: 10000
  close_steps: 12
  lift_probe: 0.025
  stage_guard_steps: 400
  grasp_depth: 0.012
  position_tolerance: 0.003
  angle_tolerance: 0.025
  rotation_clearance: 0.04
  probe_steps: 16
  release_steps: 12
  retreat_height: 0.24
  retreat_clearance: 0.1  # Expert retreat only; not a success condition.
  wait_steps: 50
  reacquire_height: 0.12
  grip_settle_speed: 0.005
policy_rollout:
  episodes: 200
  max_control_steps: 300
  exploration:
    mode: none
    std:
    - 0.06
    - 0.06
    - 0.04
    - 0.04
dataset:
  version: arm3r_upright_stable_target_no_relative_v2
  validation_fraction: 0.15
  mixing: all_rounds
bc_training:
  epochs: 40
  batch_size: 256
  updates_per_epoch: 50
  lr: 0.0003
  validation_episodes: 20
  validation_every: 5
value_training:
  epochs: 40
  batch_size: 256
  updates_per_epoch: 50
  lr: 0.0003
recap:
  method: conditioned
  n_step: 10
  threshold: 0.0
  condition_weight: 1.0
  expert_ratio: 0.25
  epochs: 40
  batch_size: 256
  updates_per_epoch: 50
  lr: 0.0003
  rounds: 1
