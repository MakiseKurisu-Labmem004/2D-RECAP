run:
  stages:
  - physics
  - expert
  - freeze
  - bc
  - rollout
  - value
  - label
  - update
  - next_rollout
  - evaluate
  - diagnose
  output: runs
  name: arm3r_upright_smooth
environment:
  gravity:
  - 0
  - 0
  - -9.81
  block_mass: 0.08
  lock_rotation: false
  max_opening: 0.08
  finger_length: 0.03
  finger_thickness: 0.008
  friction: 1.5
  workspace_x:
  - -0.35
  - 0.35
  max_height: 0.45
  timestep: 0.0025
  control_hz: 20
  max_delta: 0.01
  grip_kp: 500
  grip_force: 12
  target_half_width: 0.04  # Object center within +/-4 cm of the goal.
  success_speed: 0.015
  success_angular_speed: 0.15
  success_hold_steps: 20
  success_rule: stable_target
  task: pedestal_upright
  block_length: 0.12
  block_width: 0.04
  block_thickness: 0.04
  pedestal_edge: -0.1
  pedestal_width: 0.16
  pedestal_depth: 0.1
  # Shared ID ranges: sampled independently for collection, validation and testing.
  pedestal_height:
  - 0.12
  - 0.19
  overhang:
  - 0.03
  - 0.046
  goal_x:
  - 0.12
  - 0.2
  target_angle: -1.5707963267948966
  initial_wrist_angle: 1.5707963267948966
  initial_approach_gap: 0.08
  min_height: 0.025
  max_angle_delta: 0.05235987755982989
  wrist_range:
  - -1.8
  - 1.8
  success_angle_tolerance: 0.08726646259971647
  robot: arm3r
  render_width: 1280
  render_height: 720
  arm_base:
  - 0.38
  - 0.08
  arm_lengths:
  - 0.3
  - 0.28
  - 0.07
  arm_radii:
  - 0.021
  - 0.018
  - 0.014
  arm_masses:
  - 0.8
  - 0.5
  - 0.12
  arm_joint_ranges:
  - - -2.5
    - 2.5
  - - -2.8
    - -0.15
  - - -2.9
    - 2.9
  arm_kp:
  - 800
  - 600
  - 250
  arm_kv:
  - 35
  - 30
  - 12
  arm_torque:
  - 18
  - 12
  - 4
  arm_armature:
  - 0.02
  - 0.015
  - 0.005
