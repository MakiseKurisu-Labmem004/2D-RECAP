  episodes: 100
  max_control_steps: 300
  exploration:
    mode: none
    std:
    - 0
    - 0
    - 0
    - 0
  suites:
  - id
  pool_size: 10
  diagnostic_offsets:
  - -0.012
  - -0.006
  - 0
  - 0.006
  - 0.012
  diagnostic_repeats: 1
  diagnostic_prefix_steps: 10
  physics_episodes: 12
  physics_guard_steps: 1200
  diagnostic_axis: z
  recovery_empty_offset: 0.05
  recovery_empty_steps: 24
  recovery_drop_steps: 12
seeds:
  training: 1
  expert: 10000
  rollout: 100000
  validation: 200000
  evaluation: 300000
  diagnostics: 400000
